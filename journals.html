<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Journal</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="global-header">
  <div class="header-inner">
    <div class="title" id="title">Journal</div>

    <a class="submit-btn" target="_blank"
       href="https://www.heraldopenaccess.us/submit-manuscript">
      📄 Submit Manuscript
    </a>
  </div>
</header>

<div class="page">

<div class="journal-layout">

  <!-- LEFT YEAR -->
  <div class="year-box">
    <h3>Years</h3>
    <div id="years"></div>
  </div>

  <!-- RIGHT SINGLE COLUMN -->
  <div id="articles" class="single-column"></div>

</div>

</div>

<script>

let all=[];

const journal=localStorage.getItem("journal");

document.getElementById("title").innerText=journal;

fetch("articles.json")
.then(r=>r.json())
.then(data=>{

  all=data.filter(a=>a.Journal===journal);

  buildYears();
  render(all);

});

function buildYears(){

  const years=[...new Set(all.map(a=>a.Year))].sort((a,b)=>b-a);

  const y=document.getElementById("years");

  y.innerHTML=`<button onclick="render(all)">All</button>`;

  years.forEach(yr=>{
    y.innerHTML+=`<button onclick="filter(${yr})">${yr}</button>`;
  });

}

function filter(y){
  render(all.filter(a=>a.Year==y));
}

/* 🔥 SINGLE COLUMN RENDER FIX */
function render(list){

  const c=document.getElementById("articles");
  c.innerHTML="";

  list.forEach(a=>{

    const id=(a.DOI||"").split("/").pop();

    c.innerHTML+=`
      <div class="article-card">

        <h3>${a.Title}</h3>

        <p><b>Authors:</b> ${a.Authors}</p>
        <p><b>Year:</b> ${a.Year}</p>

        <button onclick="openA('${id}')">View Article</button>

      </div>
    `;
  });

}

function openA(id){
  window.location.href="article.html?id="+id;
}

</script>

</body>
</html>
