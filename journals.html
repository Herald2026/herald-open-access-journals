<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Journal Articles</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="global-header">
  <div class="header-inner">
    <div class="title" id="title">Journal</div>

    <a class="submit-btn"
       href="https://www.heraldopenaccess.us/journals/journal-of-psychiatry-depression-anxiety/submit-manuscript"
       target="_blank">
      📄 Submit Manuscript
    </a>
  </div>
</header>

<div class="page">

<div class="journal-layout">

  <div class="year-box">
    <h3>Years</h3>
    <div id="years"></div>
  </div>

  <div id="articles"></div>

</div>

</div>

<script>

let all=[];

const journal=localStorage.getItem("journal");

document.getElementById("title").innerText=journal;

fetch("articles.json")
.then(r=>r.json())
.then(data=>{

  all=data.filter(a=>a.Journal===journal);

  buildYears();
  render(all);
});

function buildYears(){

  const years=[...new Set(all.map(a=>a.Year))].sort((a,b)=>b-a);

  const y=document.getElementById("years");
  y.innerHTML=`<button onclick="render(all)">All</button>`;

  years.forEach(yr=>{
    y.innerHTML+=`<button onclick="filter(${yr})">${yr}</button>`;
  });

}

function filter(y){
  render(all.filter(a=>a.Year==y));
}

function render(list){

  const c=document.getElementById("articles");
  c.innerHTML="";

  list.forEach(a=>{

    const id=(a.DOI||"").split("/").pop();

    c.innerHTML+=`
      <div class="card">
        <h3>${a.Title}</h3>
        <p>${a.Authors}</p>
        <p>${a.Year}</p>
        <button onclick="openA('${id}')">Open</button>
      </div>
    `;
  });

}

function openA(id){
  window.location.href="article.html?id="+id;
}

</script>

</body>
</html>
