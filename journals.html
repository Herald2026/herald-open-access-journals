<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Journal</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="global-header">
  <div class="title" id="title">Journal</div>

  <a class="submit-btn"
     href="https://www.heraldopenaccess.us/journals/journal-of-psychiatry-depression-anxiety/submit-manuscript"
     target="_blank">
    📄 Submit Manuscript
  </a>
</header>

<div class="container">

  <div id="years"></div>

  <div id="articles" class="container"></div>

</div>

<script>

let all=[];

const journal=localStorage.getItem("journal");

document.getElementById("title").innerText=journal;

fetch("articles.json")
.then(r=>r.json())
.then(data=>{

  all=data.filter(a=>a.Journal===journal);

  buildYears();
  render(all);
});

function buildYears(){

  const years=[...new Set(all.map(a=>a.Year))].sort((a,b)=>b-a);

  let html="";

  years.forEach(y=>{
    html+=`<button onclick="filterYear(${y})">${y}</button><br><br>`;
  });

  document.getElementById("years").innerHTML=html;
}

function filterYear(y){
  render(all.filter(a=>a.Year==y));
}

function render(list){

  const c=document.getElementById("articles");
  c.innerHTML="";

  list.forEach(a=>{

    const id=(a.DOI||"").split("/").pop();

    c.innerHTML+=`
      <div class="card">
        <h3>${a.Title}</h3>
        <p>${a.Year}</p>
        <p>${a.Authors}</p>

        <button onclick="openA('${id}')">Open</button>
      </div>
    `;
  });
}

function openA(id){
  window.location.href="article.html?id="+id;
}

</script>

</body>
</html>
