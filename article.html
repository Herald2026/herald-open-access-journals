<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Article</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="global-header">
  <div class="header-inner">
    <div class="title">Article View</div>

    <a class="submit-btn"
       href="https://www.heraldopenaccess.us/journals/journal-of-psychiatry-depression-anxiety/submit-manuscript"
       target="_blank">
      📄 Submit Manuscript
    </a>
  </div>
</header>

<div class="page article-box" id="content"></div>

<script>

let data=[];

fetch("articles.json")
.then(r=>r.json())
.then(d=>{
  data=d;
  load();
});

function load(){

  const id=new URLSearchParams(location.search).get("id");

  const a=data.find(x=>(x.DOI||"").split("/").pop()===id);

  if(!a){
    document.getElementById("content").innerHTML="Not Found";
    return;
  }

  document.getElementById("content").innerHTML=`
    <div class="article-card">

      <h2>${a.Title}</h2>

      <p><b>Authors:</b> ${a.Authors}</p>
      <p><b>Journal:</b> ${a.Journal}</p>
      <p><b>Year:</b> ${a.Year}</p>

      <button onclick="window.open('https://doi.org/${a.DOI}')">
        Open DOI
      </button>

      <button onclick="window.open('https://scholar.google.com/scholar?q=${encodeURIComponent(a.Title)}')">
        Google Scholar
      </button>

    </div>
  `;
}

</script>

</body>
</html>
