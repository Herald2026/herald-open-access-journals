<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Article</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="global-header">
  <div class="title">Article View</div>

  <a class="submit-btn"
     href="https://www.heraldopenaccess.us/journals/journal-of-psychiatry-depression-anxiety/submit-manuscript"
     target="_blank">
    📄 Submit Manuscript
  </a>
</header>

<div class="container" id="content"></div>

<script>

let data=[];

fetch("articles.json")
.then(r=>r.json())
.then(d=>{
  data=d;
  load();
});

function load(){

  const id=new URLSearchParams(window.location.search).get("id");

  const a=data.find(x=>(x.DOI||"").split("/").pop()===id);

  if(!a){
    document.getElementById("content").innerHTML="Not Found";
    return;
  }

  document.getElementById("content").innerHTML=`
    <div class="card">
      <h2>${a.Title}</h2>
      <p><b>Authors:</b> ${a.Authors}</p>
      <p><b>Journal:</b> ${a.Journal}</p>
      <p><b>Year:</b> ${a.Year}</p>

      <button onclick="window.open('https://doi.org/${a.DOI}')">
        Open DOI
      </button>
    </div>
  `;
}

</script>

</body>
</html>
