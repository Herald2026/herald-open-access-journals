<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Article</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="global-header">
  <div class="header-inner">
    <div class="title">Article View</div>

    <a class="submit-btn" target="_blank"
       href="https://www.heraldopenaccess.us/submit-manuscript">
      📄 Submit Manuscript
    </a>
  </div>
</header>

<div class="page article-box" id="content"></div>

<script>

let data=[];

fetch("articles.json")
.then(r=>r.json())
.then(d=>{
  data=d;
  load();
});

function load(){

  const id=new URLSearchParams(location.search).get("id");

  const a=data.find(x=>(x.DOI||"").split("/").pop()===id);

  if(!a){
    document.getElementById("content").innerHTML="Not Found";
    return;
  }

  const title=encodeURIComponent(a.Title);

  document.getElementById("content").innerHTML=`
    <div class="article-card">

      <h2>${a.Title}</h2>

      <p><b>Authors:</b> ${a.Authors}</p>
      <p><b>Journal:</b> ${a.Journal}</p>
      <p><b>Year:</b> ${a.Year}</p>

      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;">

        <button onclick="window.open('https://doi.org/${a.DOI}')">DOI</button>

        <button onclick="window.open('https://scholar.google.com/scholar?q=${title}')">
          Google Scholar
        </button>

        ${
          a.HTML_URL
          ? `<button onclick="window.open('${a.HTML_URL}')">Publisher</button>`
          : ""
        }

      </div>

    </div>
  `;
}

</script>

</body>
</html>
