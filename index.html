<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Herald Journals</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="global-header">
  <div class="header-inner">

    <div class="title">Herald Open Access Journals</div>

    <a class="submit-btn" target="_blank"
       href="https://www.heraldopenaccess.us/journals/journal-of-psychiatry-depression-anxiety/submit-manuscript">
      📄 Submit Manuscript
    </a>

  </div>
</header>

<div class="page">

<input class="search" id="search" placeholder="Search journals...">

<h3>🔥 Featured Journals</h3>
<div class="container" id="featured"></div>

<h3>All Journals</h3>
<div class="container" id="journalContainer"></div>

</div>

<script>

fetch("articles.json")
.then(r=>r.json())
.then(data=>{

  const map={};

  data.forEach(a=>{
    const j=a.Journal;
    map[j]=(map[j]||0)+1;
  });

  const entries=Object.entries(map);

  const featured=entries.slice(0,6);

  render(featured,"featured");
  render(entries,"journalContainer");

});

function render(list,id){

  const c=document.getElementById(id);
  c.innerHTML="";

  list.forEach(([j,count])=>{
    c.innerHTML+=`
      <div class="card">
        <h3>${j}</h3>
        <p>${count} Articles</p>
        <button onclick="openJ('${j}')">View</button>
      </div>
    `;
  });

}

function openJ(j){
  localStorage.setItem("journal",j);
  window.location.href="journals.html";
}

</script>

</body>
</html>
