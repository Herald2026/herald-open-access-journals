<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Herald Journals</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f5f7fb;
}

/* HEADER */
header{
  background:#0b3d91;
  color:white;
  padding:25px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:26px;
}

/* CONTROLS */
.controls{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:15px 25px;
  flex-wrap:wrap;
}

.search{
  flex:1;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

select{
  padding:10px;
  border-radius:8px;
}

/* GRID */
.container{
  padding:25px;
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:20px;
}

/* CLEAN CARD */
.card{
  background:white;
  border:1px solid #e2e6ef;
  border-left:6px solid #0b3d91;
  padding:18px;
  border-radius:10px;
  cursor:pointer;
  transition:0.2s;
  min-height:120px;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 6px 16px rgba(0,0,0,0.08);
}

.card h3{
  margin:0 0 8px 0;
  font-size:17px;
  color:#111;
}

.card p{
  margin:0;
  color:#555;
}

/* BUTTON */
.card button{
  margin-top:12px;
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#0b3d91;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* RESPONSIVE */
@media(max-width:1000px){
  .container{ grid-template-columns:repeat(2,1fr); }
}

@media(max-width:600px){
  .container{ grid-template-columns:1fr; }
}
</style>

</head>

<body>

<header>
  <h1>Herald Open Access Journals</h1>
</header>

<!-- CONTROLS -->
<div class="controls">
  <input class="search" id="searchBox" placeholder="Search journals...">

  <select id="sortBox">
    <option value="desc">Most Articles</option>
    <option value="asc">A - Z</option>
  </select>
</div>

<!-- GRID -->
<div class="container" id="journalContainer"></div>

<script>

let journals=[];
const container=document.getElementById("journalContainer");

/* LOAD */
fetch("articles.json")
.then(res=>res.json())
.then(data=>{

  const journalCount={};

  data.forEach(a=>{
    const j=(a.Journal||"").trim();
    if(!j) return;
    journalCount[j]=(journalCount[j]||0)+1;
  });

  journals=Object.entries(journalCount);

  render();
});

/* SEARCH + SORT */
document.getElementById("searchBox").addEventListener("input",render);
document.getElementById("sortBox").addEventListener("change",render);

/* RENDER */
function render(){

  let q=document.getElementById("searchBox").value.toLowerCase();
  let sort=document.getElementById("sortBox").value;

  let list=journals.filter(j=>j[0].toLowerCase().includes(q));

  if(sort==="asc"){
    list.sort((a,b)=>a[0].localeCompare(b[0]));
  }else{
    list.sort((a,b)=>b[1]-a[1]);
  }

  container.innerHTML="";

  list.forEach(([journal,count])=>{

    const div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <h3>${journal}</h3>
      <p>${count} Articles</p>

      <button onclick="openJournal('${journal.replace(/'/g,"")}' )">
        View Journal
      </button>
    `;

    container.appendChild(div);
  });

}

/* OPEN */
function openJournal(journal){
  localStorage.setItem("journal",journal);
  window.location.href="journals.html";
}

</script>

</body>
</html>
