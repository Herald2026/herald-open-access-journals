<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Herald Journals</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="global-header">
  <div class="title">Herald Open Access Journals</div>

  <a class="submit-btn"
     href="https://www.heraldopenaccess.us/journals/journal-of-psychiatry-depression-anxiety/submit-manuscript"
     target="_blank">
    📄 Submit Manuscript
  </a>
</header>

<input class="search" id="searchBox" placeholder="Search journals...">

<div class="container" id="journalContainer"></div>

<script>

fetch("articles.json")
.then(r=>r.json())
.then(data=>{

  const map={};

  data.forEach(a=>{
    const j=(a.Journal||"").trim();
    if(!j) return;
    map[j]=(map[j]||0)+1;
  });

  render(Object.entries(map));
});

document.getElementById("searchBox").addEventListener("input",function(){

  fetch("articles.json")
  .then(r=>r.json())
  .then(data=>{

    const q=this.value.toLowerCase();

    const map={};

    data.forEach(a=>{
      const j=(a.Journal||"").trim();
      if(!j.toLowerCase().includes(q)) return;
      map[j]=(map[j]||0)+1;
    });

    render(Object.entries(map));
  });

});

function render(list){

  const container=document.getElementById("journalContainer");
  container.innerHTML="";

  list.forEach(([j,c])=>{

    container.innerHTML+=`
      <div class="card">
        <h3>${j}</h3>
        <p>${c} Articles</p>
        <button onclick="openJournal('${j}')">
          View Journal
        </button>
      </div>
    `;
  });
}

function openJournal(j){
  localStorage.setItem("journal",j);
  window.location.href="journals.html";
}

</script>

</body>
</html>
