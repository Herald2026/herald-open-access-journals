<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Herald Journals</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="global-header">
  <div class="header-inner">

    <div class="title">Herald Open Access Journals</div>

    <a class="submit-btn"
       href="https://www.heraldopenaccess.us/journals/journal-of-psychiatry-depression-anxiety/submit-manuscript"
       target="_blank">
      📄 Submit Manuscript
    </a>

  </div>
</header>

<div class="page">

<div class="container" id="journalContainer"></div>

</div>

<script>

fetch("articles.json")
.then(r=>r.json())
.then(data=>{

  const map={};

  data.forEach(a=>{
    const j=(a.Journal||"").trim();
    if(!j) return;
    map[j]=(map[j]||0)+1;
  });

  render(Object.entries(map));

});

function render(list){

  const c=document.getElementById("journalContainer");
  c.innerHTML="";

  list.forEach(([j,count])=>{
    c.innerHTML+=`
      <div class="card">
        <h3>${j}</h3>
        <p>${count} Articles</p>
        <button onclick="openJ('${j}')">View Journal</button>
      </div>
    `;
  });

}

function openJ(j){
  localStorage.setItem("journal",j);
  window.location.href="journals.html";
}

</script>

</body>
</html>
