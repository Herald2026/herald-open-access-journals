<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Journals</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="global-header">
  <div class="header-inner">
    <div class="title">Herald Scholarly Open Access Journals</div>

    <a class="submit-btn" target="_blank"
       href="https://www.heraldopenaccess.us/submit-manuscript">
      📄 Submit Manuscript
    </a>
  </div>
</header>

<div class="page">

<div class="container" id="journalContainer"></div>

</div>

<script>

fetch("articles.json")
.then(r=>r.json())
.then(data=>{

  const map={};

  data.forEach(a=>{
    const j=a.Journal;
    map[j]=(map[j]||0)+1;
  });

  const sorted = Object.entries(map)
    .sort((a,b)=>b[1]-a[1]); // TOP COUNT FIRST

  render(sorted);

});

function render(list){

  const c=document.getElementById("journalContainer");
  c.innerHTML="";

  list.forEach(([j,count])=>{
    c.innerHTML+=`
      <div class="card">
        <h3>${j}</h3>
        <p><b>${count}</b> Articles</p>
        <button onclick="openJ('${j}')">View Journal Articles</button>
      </div>
    `;
  });

}

function openJ(j){
  localStorage.setItem("journal",j);
  window.location.href="journals.html";
}

</script>

</body>
</html>
